<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드 - How Much You Need</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --background: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--background);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .login-box,
        .dashboard {
            background: var(--surface);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .login-box {
            max-width: 400px;
            margin: 5rem auto;
        }

        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            background: var(--surface-light);
            border: 2px solid transparent;
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .question-card {
            background: var(--surface-light);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .question-text {
            font-size: 1.125rem;
            margin-bottom: 1rem;
        }

        .question-meta {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
        }

        .button-group button {
            flex: 1;
        }

        .btn-approve {
            background: var(--success);
        }

        .btn-reject {
            background: var(--danger);
        }

        .hidden {
            display: none !important;
        }

        .error {
            color: var(--danger);
            text-align: center;
            margin-top: 1rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Login Box -->
        <div id="loginBox" class="login-box">
            <h1>🔒 관리자 로그인</h1>
            <input type="password" id="passwordInput" placeholder="비밀번호를 입력하세요"
                onkeypress="if(event.key==='Enter') login()">
            <button onclick="login()">로그인</button>
            <div id="loginError" class="error hidden"></div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="dashboard hidden">
            <h1>📋 대기 중인 질문 관리</h1>
            <button onclick="loadPendingQuestions()" style="margin-bottom: 1rem;">🔄 새로고침</button>
            <div id="questionsList"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        let adminPassword = '';

        async function login() {
            const password = document.getElementById('passwordInput').value;

            try {
                const response = await fetch(`${API_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (response.ok) {
                    adminPassword = password;
                    document.getElementById('loginBox').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    loadPendingQuestions();
                } else {
                    showError(data.error || '로그인 실패');
                }
            } catch (error) {
                showError('서버 연결 실패');
            }
        }

        async function loadPendingQuestions() {
            const questionsList = document.getElementById('questionsList');
            questionsList.innerHTML = '<div class="empty-state">로딩 중...</div>';

            try {
                const response = await fetch(`${API_URL}/api/admin/pending-questions`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'password': adminPassword
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    displayQuestions(data.questions);
                } else {
                    questionsList.innerHTML = `<div class="empty-state">${data.error}</div>`;
                }
            } catch (error) {
                questionsList.innerHTML = '<div class="empty-state">서버 연결 실패</div>';
            }
        }

        function displayQuestions(questions) {
            const questionsList = document.getElementById('questionsList');

            if (questions.length === 0) {
                questionsList.innerHTML = '<div class="empty-state">대기 중인 질문이 없습니다 🎉</div>';
                return;
            }

            questionsList.innerHTML = questions.map(q => `
                <div class="question-card" id="question-${q.id}">
                    <div class="question-text">"${q.text}"</div>
                    <div class="question-meta">
                        제출 시간: ${new Date(q.submitted_at).toLocaleString('ko-KR')}
                        <br>IP: ${q.created_by_ip}
                    </div>
                    <div class="button-group">
                        <button class="btn-approve" onclick="approve(${q.id})">✅ 승인</button>
                        <button class="btn-reject" onclick="reject(${q.id})">❌ 거부</button>
                    </div>
                </div>
            `).join('');
        }

        async function approve(questionId) {
            try {
                const response = await fetch(`${API_URL}/api/admin/approve/${questionId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: adminPassword })
                });

                if (response.ok) {
                    document.getElementById(`question-${questionId}`).remove();
                    alert('질문이 승인되었습니다!');
                } else {
                    alert('승인 실패');
                }
            } catch (error) {
                alert('서버 오류');
            }
        }

        async function reject(questionId) {
            if (!confirm('정말 이 질문을 거부하시겠습니까?')) return;

            try {
                const response = await fetch(`${API_URL}/api/admin/reject/${questionId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: adminPassword })
                });

                if (response.ok) {
                    document.getElementById(`question-${questionId}`).remove();
                    alert('질문이 거부되었습니다.');
                } else {
                    alert('거부 실패');
                }
            } catch (error) {
                alert('서버 오류');
            }
        }

        function showError(message) {
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
            setTimeout(() => errorEl.classList.add('hidden'), 3000);
        }
    </script>
</body>

</html>
